spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/jpko_community
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

cookie:
  secure: false
  same-site: Lax
  domain: ""

cloud:
  aws:
    s3:
      bucket: jpko-test-bucket
    cloudfront:
      domain: test.cloudfront.net
    region:
      static: ap-northeast-2

mail:
  base-url: http://localhost:3000

turnstile:
  enabled: false
