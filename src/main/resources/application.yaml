spring:
  application:
    name: jpko-community
  profiles:
    active: dev
  mvc:
    locale: ko
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true

app:
  throttle:
    post-interval-seconds: 20
    comment-interval-seconds: 5
  image:
    gif2webp-path: gif2webp
  points:
    create-post: 50
    create-comment: 10
    get-um-ji-cheok: 10
  checkin:
    unit: 50 # 지급액은 항상 이 값의 배수로만 나온다
    ranges:
      - min-amount: -300
        max-amount: -50
        weight: 15   # 15% 확률로 손실
      - min-amount: 0
        max-amount: 0
        weight: 10   # 10% 확률로 본전
      - min-amount: 50
        max-amount: 500
        weight: 55   # 55% 확률로 소소하게 획득
      - min-amount: 550
        max-amount: 1000
        weight: 20   # 20% 확률로 크게 획득
  roulette:
    bet-unit: 100
    min-bet: 100
    max-bet: 5000
    win-probability: 0.45
    fee-rate: 0.05
  transfer:
    unit: 10
    fee-ranges:
      - min-amount: -3000
        max-amount: -500
        weight: 5
      - min-amount: 0
        max-amount: 0
        weight: 10
      - min-amount: 10
        max-amount: 50
        weight: 80
      - min-amount: 500
        max-amount: 3000
        weight: 5

server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

mail:
  from: no-reply@jpkocommunity.site
  from-name: JPKO Community

jwt:
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

verification-token:
  email-verification-expiration: 86400000   # 24시간 (ms)
  password-reset-expiration: 1800000        # 30분 (ms)