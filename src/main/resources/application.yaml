spring:
  application:
    name: jpko-community
  profiles:
    active: dev
  mvc:
    locale: ko
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true

app:
  throttle:
    post-interval-seconds: 20
    comment-interval-seconds: 5
  image:
    gif2webp-path: gif2webp
  points:
    create-post: 50
    create-comment: 10
    get-um-ji-cheok: 10
  checkin:
    unit: 10 # 지급액은 항상 이 값의 배수로만 나온다
    ranges:
      - min-amount: -300
        max-amount: -50
        weight: 15   # 15% 확률로 손실
      - min-amount: 0
        max-amount: 0
        weight: 10   # 10% 확률로 본전
      - min-amount: 50
        max-amount: 500
        weight: 55   # 55% 확률로 소소하게 획득
      - min-amount: 550
        max-amount: 1000
        weight: 20   # 20% 확률로 크게 획득
  roulette:
    bet-unit: 100
    min-bet: 100
    max-bet: 5000
    win-probability: 0.45
    fee-rate: 0.05
  pachinko:
    ball-price: 50            # 구슬 1개당 가격
    min-balls: 1
    max-balls: 5000             # 한 판에 쏠 수 있는 최대 구슬 개수(연출·남용 방지용 상한)
    fee-rate: 0.03            # 배당표 자체가 이미 하우스 엣지를 크게 갖고 있어 룰렛보다 낮게 잡음
    rows: 8                   # 9개 슬롯(0~8)
    right-probability: 0.5    # 못 하나당 우측으로 튕길 확률 — 의도적으로 클라이언트에 노출 안 함
    slot-multipliers: [10.0, 3.0, 1.5, 0.5, 0.2, 0.5, 1.5, 3.0, 10.0]
  slot:
    bet-unit: 100
    min-bet: 100
    max-bet: 5000
    fee-rate: 0.03
    symbols:
      - name: CHERRY
        weight: 50
        multiplier: 3.0
      - name: BELL
        weight: 30
        multiplier: 6.0
      - name: BAR
        weight: 15
        multiplier: 15.0
      - name: SEVEN
        weight: 5
        multiplier: 50.0
  transfer:
    unit: 10
    fee-ranges:
      - min-amount: -3000
        max-amount: -500
        weight: 0
      - min-amount: 0
        max-amount: 0
        weight: 15
      - min-amount: 10
        max-amount: 50
        weight: 80
      - min-amount: 500
        max-amount: 3000
        weight: 5
  notification:
    retention-days: 30 # 알림 보관 기간 (days)

server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

mail:
  from: no-reply@jpkocommunity.site
  from-name: JPKO Community

jwt:
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

verification-token:
  email-verification-expiration: 86400000   # 24시간 (ms)
  password-reset-expiration: 1800000        # 30분 (ms)
  pre-signup-expiration: 86400000           # 24시간 (ms)