spring:
  application:
    name: jpko-community
  profiles:
    active: dev
  mvc:
    locale: ko
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 31MB
      max-request-size: 31MB
      file-size-threshold: 0B
  flyway:
    enabled: true
    out-of-order: true

app:
  throttle:
    post-interval-seconds: 20
    comment-interval-seconds: 5
  image:
    gif2webp-path: gif2webp
    cwebp-path: cwebp
    ffmpeg-path: ffmpeg
  points:
    create-post: 1000
    create-comment: 100
    daily-activity-limit: 10000 # 활동 보상으로 일일 받을 포인트 총량
  checkin:
    amount: 1000  # 고정 지급 포인트
    monthly-bonuses: # 누적 출석 보너스 포인트 횟수 기준
      - count: 7
        bonus: 3000
      - count: 15
        bonus: 5000
      - count: 25
        bonus: 10000
  roulette:
    bet-unit: 100
    min-bet: 100
    max-bet: 10000
    win-probability: 0.5
    fee-rate: 0.05
  pachinko:
    ball-price: 100            # 구슬 1개당 가격
    min-balls: 1
    max-balls: 1000          # 한 판에 쏠 수 있는 최대 구슬 개수(연출·남용 방지용 상한)
    fee-rate: 0.03            # 배당표 자체가 이미 하우스 엣지를 크게 갖고 있어 룰렛보다 낮게 잡음
    rows: 8                   # 9개 슬롯(0~8)
    right-probability: 0.5    # 못 하나당 우측으로 튕길 확률 — 의도적으로 클라이언트에 노출 안 함
    slot-multipliers: [150.0, 2.0, 0.5, 0.1, 0.0, 0.1, 0.5, 2.0, 30.0]
  slot:
    bet-unit: 100
    min-bet: 100
    max-bet: 10000
    fee-rate: 0.03
    symbols:
      - name: CHERRY
        weight: 60
        multiplier: 2.0
      - name: BELL
        weight: 25
        multiplier: 15.0
      - name: BAR
        weight: 10
        multiplier: 222.0
      - name: SEVEN
        weight: 5
        multiplier: 777.0
  notification:
    retention-days: 30 # 알림 보관 기간 (days)
  ranking:
    top-size: 5
    neighbor-size: 5
  popular-post:
    like-weight: 3.0
    comment-weight: 2.0
    view-weight: 1.0
    refresh-interval-minutes: 10
    display-size: 5           # 메인 노출 개수
    today:
      days: 1
      gravity: 0.4            # 약한 감쇠 - 하루 동안만 상위권에 남도록
      min-engagement: 0       # 초기화 시점에 좋아요/댓글 0인 글도 포함
    weekly:
      days: 7                 # 오늘 포함 7일
      gravity: 0.6            # 완만한 감쇠 - 좋은 글이 며칠 동안 상위권에 남도록
      min-engagement: 1       # 좋아요/댓글 0인 글은 주간 인기글에서 제외
  exp:
    daily-limit: 500          # 하루에 활동으로 얻을 수 있는 exp 최대치
    create-post: 100
    create-comment: 20
    check-in: 100 # 일일 상한 제외

server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

mail:
  from: no-reply@jpkocommunity.site
  from-name: JPKO Community

jwt:
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

verification-token:
  email-verification-expiration: 86400000   # 24시간 (ms)
  password-reset-expiration: 1800000        # 30분 (ms)
  pre-signup-expiration: 86400000           # 24시간 (ms)