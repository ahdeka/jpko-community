name: PR 라벨 자동 할당
on:
  pull_request:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: PR 제목 접두사로 라벨 매칭
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: |
            ${{ startsWith(github.event.pull_request.title, '[Feature]') && 'type:feature' || '' }}
            ${{ startsWith(github.event.pull_request.title, '[Fix]') && 'type:fix' || '' }}
            ${{ startsWith(github.event.pull_request.title, '[Refactor]') && 'type:refactor' || '' }}
            ${{ startsWith(github.event.pull_request.title, '[Chore]') && 'type:chore' || '' }}