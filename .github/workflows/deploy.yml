name: Deploy to EC2

on:
  push:
    branches: [ main ]

# OIDC로 AWS 임시 자격증명을 받기 위해 필요
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jpko-community

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 테스트용 DB 서비스 컨테이너
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jpko_community
          POSTGRES_USER: jpko
          POSTGRES_PASSWORD: jpko
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jpko"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build and test with Gradle
        env:
          DB_HOST: localhost
          DB_USER: jpko
          DB_PASSWORD: jpko
          JWT_SECRET: ci-test-secret-not-real
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Upload deploy files to S3
        run: |
          aws s3 cp docker-compose.prod.yml "s3://${{ secrets.DEPLOY_BUCKET }}/deploy/docker-compose.prod.yml"
          aws s3 cp deploy.sh "s3://${{ secrets.DEPLOY_BUCKET }}/deploy/deploy.sh"

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail

          # 8-1. 명령 전송 (EC2가 S3에서 파일 받아 deploy.sh 실행; CRLF 방어 포함)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "$(jq -n --arg bucket "$BUCKET" --arg img "$IMAGE" '{
              commands: [
                "set -euo pipefail",
                "mkdir -p /opt/jpko-community",
                "cd /opt/jpko-community",
                "aws s3 cp s3://\($bucket)/deploy/deploy.sh ./deploy.sh",
                "aws s3 cp s3://\($bucket)/deploy/docker-compose.prod.yml ./docker-compose.prod.yml",
                "sed -i \"s/\\r$//\" deploy.sh",
                "chmod +x deploy.sh",
                "bash deploy.sh \($img)"
              ]
            }')" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId: $CMD_ID"

          # 8-2. 완료까지 폴링 (SSM은 비동기 → 결과를 잡 상태에 반영)
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "::notice::배포 성공"
                break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::배포 실패 ($STATUS)"
                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
              *)
                echo "진행 중... ($STATUS)"
                sleep 5 ;;
            esac
          done

          # 8-3. 성공 로그 출력
          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
