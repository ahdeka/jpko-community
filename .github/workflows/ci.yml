name: CI

# dev에 직접 push 할 때 (PR 머지 포함)
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

# 코드 읽기 권한이면 충분
permissions:
  contents: read

# 같은 브랜치에 새 커밋 오면 이전 실행은 취소 - 최신 커밋만 검증하도록
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트용 DB 서비스 컨테이너
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jpko_community
          POSTGRES_USER: jpko
          POSTGRES_PASSWORD: jpko
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jpko"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build and test with Gradle
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_USER: jpko
          DB_PASSWORD: jpko
          JWT_SECRET: ci-test-secret-not-real-but-long-enough-for-hs256-signing-32bytes+
        run: |
          chmod +x gradlew
          ./gradlew build

      # 실패했을 때만 테스트 리포트 올려서, Actions 화면에서 원인 확인 가능하도록
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7