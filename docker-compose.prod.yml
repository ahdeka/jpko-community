services:
  postgres:
    image: postgres:16
    container_name: jpko-postgres
    environment:
      POSTGRES_DB: jpko_community
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging: # docker logs 용량 제한 설정 (무제한 방지)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE}
    container_name: jpko-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    depends_on:
      - postgres
    restart: always
    volumes:
      - ./logs:/app/logs # 하루별 로그 txt 호스트에 저장
    logging: # docker logs 용량 제한 설정 (무제한 방지)
        driver: "json-file"
        options:
            max-size: "10m"
            max-file: "3"

volumes:
  postgres_data: